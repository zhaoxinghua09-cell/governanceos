<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="'Segoe UI',system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="phase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- card background -->
  <rect x="8" y="8" width="944" height="544" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- title -->
  <text x="480" y="46" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">GovernanceOS — 互链发动机 of the LGD agent-skills supermarket</text>
  <text x="480" y="72" text-anchor="middle" font-size="13" fill="#64748b">单一中枢 · 串联 LGD 生态超市 200+ 已发布技能/插件 · 治理即信任底座</text>

  <!-- outer ecosystem ring -->
  <circle cx="480" cy="320" r="240" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="480" y="566" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">LGD 生态超市 · 200+ published skills &amp; plugins (one governed network)</text>

  <!-- hub -->
  <circle cx="480" cy="320" r="78" fill="url(#hub)"/>
  <text x="480" y="312" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">GovernanceOS</text>
  <text x="480" y="336" text-anchor="middle" font-size="14" fill="#dbeafe">互链发动机</text>
  <text x="480" y="356" text-anchor="middle" font-size="11" fill="#bfdbfe">router · trust · hub</text>

  <!-- phase nodes -->
  <g>
    <rect x="150" y="120" width="150" height="58" rx="10" fill="url(#phase)"/>
    <text x="225" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">SPEC</text>
    <text x="225" y="166" text-anchor="middle" font-size="11" fill="#e0f2fe">定界 · scope &amp; charter</text>

    <rect x="660" y="120" width="150" height="58" rx="10" fill="url(#phase)"/>
    <text x="735" y="146" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PLAN</text>
    <text x="735" y="166" text-anchor="middle" font-size="11" fill="#e0f2fe">防御纵深 · 5 skills</text>

    <rect x="660" y="462" width="150" height="58" rx="10" fill="url(#phase)"/>
    <text x="735" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">GATE</text>
    <text x="735" y="508" text-anchor="middle" font-size="11" fill="#e0f2fe">两道硬门 · 2 skills</text>

    <rect x="150" y="462" width="150" height="58" rx="10" fill="url(#phase)"/>
    <text x="225" y="488" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">AUDIT</text>
    <text x="225" y="508" text-anchor="middle" font-size="11" fill="#e0f2fe">凭证留痕 · 2 skills</text>
  </g>

  <!-- arrows hub -> phases -->
  <line x1="430" y1="262" x2="270" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="530" y1="262" x2="690" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="530" y1="378" x2="690" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="430" y1="378" x2="270" y2="470" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- skill chips under PLAN/GATE/AUDIT -->
  <g font-size="10" fill="#334155">
    <text x="735" y="200" text-anchor="middle">redteam · injection-shield</text>
    <text x="735" y="216" text-anchor="middle">leak-scanner · desens · kill-switch</text>
    <text x="735" y="440" text-anchor="middle">skill-quality-gate</text>
    <text x="735" y="454" text-anchor="middle">publish-quality-gate</text>
    <text x="225" y="440" text-anchor="middle">lgd-badge-issuer</text>
    <text x="225" y="454" text-anchor="middle">lgd-badge-verify</text>
  </g>

  <!-- legend / badges -->
  <g font-size="12" fill="#0f172a">
    <text x="150" y="552" font-weight="700" fill="#16a34a">有籍 100% · 有证 99% · 有门禁 99%</text>
  </g>
</svg>
